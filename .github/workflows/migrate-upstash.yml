# Chép dữ liệu bảng xếp hạng từ Upstash Redis sang Supabase (chạy tay 1 lần: Actions → Migrate Upstash → Run workflow)
# Biến môi trường lấy từ Vercel (Production) bằng `vercel pull`, không in ra log.
name: Migrate Upstash to Supabase

on:
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Pull Vercel environment
        run: npx --yes vercel@latest pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Migrate
        run: node --env-file=.vercel/.env.production.local scripts/migrate-upstash.mjs
