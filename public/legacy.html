<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sổ Tay Từ Vựng Teyvat · B1-1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:wght@400;600;700&family=Noto+Serif+JP:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sky0:#0b0f22;--sky1:#131a36;--sky2:#1f2a52;--sky3:#34457c;
  --gold:#d3bc8e;--gold2:#f3d38a;--gold3:#a88b55;
  --cream:#ece5d8;--cream2:#f6f1e7;--ink:#4a5366;--ink2:#2f3547;--mute:#8a8fa0;
  --ok:#5fae63;--okbg:#e3f1dc;--bad:#d0605a;--badbg:#f7e0dc;
  --r3:#5a8fd0;--r4:#a06bd6;--r5:#e0a93c;
  --serif:"Noto Serif","Noto Serif JP","Times New Roman",serif;
  --jp:"Noto Serif JP","Yu Mincho","MS Mincho",serif;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%}
body{
  font-family:var(--serif);color:var(--cream);
  background:
    radial-gradient(1200px 700px at 80% -10%,rgba(120,150,255,.22),transparent 60%),
    radial-gradient(900px 600px at 0% 110%,rgba(211,188,142,.14),transparent 60%),
    linear-gradient(180deg,var(--sky0),var(--sky1) 40%,var(--sky2));
  background-attachment:fixed;min-height:100vh;overflow-x:hidden;
}
#stars{position:fixed;inset:0;pointer-events:none;z-index:0}
#stars i{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;opacity:.6;animation:tw 4s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.15}50%{opacity:.85}}
.wrap{position:relative;z-index:1;max-width:1000px;margin:0 auto;padding:0 16px 60px}
button{font-family:inherit;cursor:pointer}
svg.pg{width:1.1em;height:1.1em;vertical-align:-.18em}

/* header */
header.top{position:sticky;top:0;z-index:20;backdrop-filter:blur(8px);background:linear-gradient(180deg,rgba(11,15,34,.92),rgba(11,15,34,.7));border-bottom:1px solid rgba(211,188,142,.25)}
header.top .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;min-width:0}
.brand .emb{width:34px;height:34px;flex:none}
.brand b{display:block;font-size:17px;letter-spacing:.5px;color:var(--gold2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--gold);opacity:.8;letter-spacing:1.5px}
.spacer{flex:1}
.curr{display:flex;align-items:center;gap:6px;background:rgba(0,0,0,.35);border:1px solid rgba(211,188,142,.35);border-radius:99px;padding:5px 12px 5px 8px;font-weight:600;color:var(--cream);font-variant-numeric:tabular-nums}
.curr svg{width:20px;height:20px}
.navbtn{background:rgba(236,229,216,.08);border:1px solid rgba(211,188,142,.4);color:var(--gold2);border-radius:99px;padding:7px 14px;font-size:14px;display:flex;align-items:center;gap:6px;white-space:nowrap}
.navbtn:hover{background:rgba(236,229,216,.16)}
.brand>div{min-width:0}
@media(max-width:560px){.brand{flex:1}.spacer{display:none}.brand small{display:none}.brand b{font-size:14px}.navbtn .lbl{display:none}.navbtn{padding:7px 10px}.qcard{padding-top:50px!important}}

/* titles */
.pagehead{text-align:center;margin:34px 0 22px}
.pagehead h1{margin:0;font-size:30px;color:var(--gold2);letter-spacing:1px;font-weight:700;text-shadow:0 2px 18px rgba(243,211,138,.25)}
.pagehead p{margin:8px 0 0;color:var(--gold);font-size:14px;opacity:.9}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:10px auto 0;max-width:420px}
.orn:before,.orn:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,transparent,var(--gold),transparent)}
.orn span{width:8px;height:8px;transform:rotate(45deg);border:1px solid var(--gold);background:var(--sky2)}

/* panels */
.panel{position:relative;background:linear-gradient(180deg,rgba(40,52,95,.78),rgba(22,29,58,.86));border:1px solid rgba(211,188,142,.45);border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 0 0 3px rgba(11,15,34,.5),inset 0 0 0 4px rgba(211,188,142,.18)}
.panel:before,.panel:after{content:"";position:absolute;width:10px;height:10px;transform:rotate(45deg);background:var(--sky1);border:1px solid var(--gold);top:-6px;left:50%;margin-left:-5px}
.panel:after{top:auto;bottom:-6px}
.parch{background:linear-gradient(180deg,var(--cream2),var(--cream));color:var(--ink);border:1px solid #cbb98f;border-radius:6px;box-shadow:0 10px 30px rgba(0,0,0,.4),inset 0 0 0 4px var(--cream2),inset 0 0 0 5px #d9c9a3}

/* stats */
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:24px}
.stat{padding:10px 18px;text-align:center;min-width:120px}
.stat b{display:block;font-size:22px;color:var(--gold2);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--gold);letter-spacing:.5px}

/* topic grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}
.tcard{cursor:pointer;padding:18px 18px 16px;transition:transform .18s,box-shadow .18s;overflow:hidden}
.tcard:hover{transform:translateY(-3px);box-shadow:0 14px 34px rgba(0,0,0,.45),0 0 0 1px var(--gold2),inset 0 0 0 3px rgba(11,15,34,.5)}
.tcard .glow{position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,var(--el) 0%,transparent 70%);opacity:.35;pointer-events:none}
.tcard .tchar{position:absolute;right:12px;top:12px;width:68px;height:68px;border-radius:50%;border:1px solid var(--gold);background:radial-gradient(circle,var(--el),rgba(20,26,54,.9) 75%);object-fit:cover;transition:transform .2s}
.tcard:hover .tchar{transform:scale(1.08)}
.tcard h3,.tcard .vi{padding-right:76px}
.tcard .num{font-size:12px;letter-spacing:3px;color:var(--gold);text-transform:uppercase}
.tcard .num em{font-style:normal;color:var(--el);filter:brightness(1.4)}
.tcard h3{margin:6px 0 2px;font-family:var(--jp);font-size:22px;color:var(--cream2);font-weight:700}
.tcard .vi{color:var(--gold);font-size:14px;margin-bottom:14px}
.tcard .meta{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#c9cbd6}
.bar{height:6px;border-radius:9px;background:rgba(0,0,0,.4);overflow:hidden;margin-top:10px;border:1px solid rgba(211,188,142,.25)}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold3),var(--gold2));border-radius:9px;transition:width .4s}
.starsrow{color:var(--gold2);letter-spacing:1px;font-size:14px}
.starsrow .off{color:rgba(211,188,142,.25)}

/* section list */
.back{display:inline-flex;align-items:center;gap:6px;margin-top:20px;color:var(--gold);background:none;border:none;font-size:14px;padding:4px 0}
.back:hover{color:var(--gold2)}
.slist{display:flex;flex-direction:column;gap:12px}
.srow{display:flex;align-items:center;gap:14px;padding:14px 16px}
.srow .ico{flex:none;width:52px;height:52px;display:grid;place-items:center;position:relative}
.srow .ico:before{content:"";position:absolute;inset:6px;transform:rotate(45deg);border:1px solid var(--gold);background:linear-gradient(135deg,rgba(243,211,138,.25),rgba(20,26,54,.8))}
.srow .ico span{position:relative;font-size:12px;font-weight:700;color:var(--gold2);text-align:center;line-height:1.05}
.srow .txt{flex:1;min-width:0}
.srow .txt b{display:block;font-size:16px;color:var(--cream2)}
.srow .txt b small{font-family:var(--jp);font-weight:400;color:var(--gold);font-size:13px;margin-left:6px}
.srow .txt .sub{font-family:var(--jp);font-size:13px;color:#b8bccb;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow .res{text-align:right;flex:none;font-size:12px;color:#c9cbd6;min-width:74px}
.srow .res b{display:block;font-size:15px;color:var(--gold2)}
.srow:before,.srow:after{display:none}
.srow.all{border-color:var(--gold2);background:linear-gradient(180deg,rgba(90,70,30,.55),rgba(30,30,55,.9))}
@media(max-width:560px){.srow{flex-wrap:wrap}.srow .txt{flex-basis:calc(100% - 70px)}.srow .res{text-align:left;flex:1}}

/* genshin buttons */
.gbtn{display:inline-flex;align-items:center;gap:10px;border:none;border-radius:99px;padding:7px 20px 7px 7px;font-size:15px;font-weight:600;background:var(--cream);color:var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25),0 0 0 1px rgba(0,0,0,.15);transition:filter .15s,transform .1s;white-space:nowrap}
.gbtn:hover{filter:brightness(1.06);box-shadow:0 0 0 2px var(--gold2),0 0 18px rgba(243,211,138,.45)}
.gbtn:active{transform:scale(.97)}
.gbtn .c{width:26px;height:26px;border-radius:50%;background:var(--ink2);display:grid;place-items:center;flex:none}
.gbtn .c:after{content:"";width:12px;height:12px;border-radius:50%;border:2.5px solid var(--gold2)}
.gbtn.x .c:after{content:"✕";border:none;width:auto;height:auto;color:#66b7ff;font-size:13px;font-weight:700}
.gbtn.tri .c:after{border:none;width:0;height:0;border-radius:0;border-left:9px solid var(--gold2);border-top:6px solid transparent;border-bottom:6px solid transparent;margin-left:3px}
.gbtn.dark{background:var(--ink2);color:var(--cream)}
.gbtn.dark .c{background:var(--cream)}
.gbtn.dark .c:after{border-color:var(--ink2)}
.gbtn[disabled]{opacity:.45;pointer-events:none}
.gbtn.sm{font-size:13px;padding:5px 14px 5px 5px}
.gbtn.sm .c{width:22px;height:22px}

/* modal */
.modal{position:fixed;inset:0;z-index:50;background:rgba(5,8,20,.72);display:grid;place-items:center;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.dialog{width:min(460px,100%);padding:26px 24px 22px;text-align:center}
.dialog h2{margin:0 0 4px;font-size:21px;color:var(--ink2)}
.dialog .jp{font-family:var(--jp);color:var(--gold3);font-size:14px}
.dialog hr{border:none;height:1px;background:linear-gradient(90deg,transparent,#c9b68a,transparent);margin:16px 0}
.qn{font-size:44px;font-weight:700;color:var(--ink2);font-variant-numeric:tabular-nums;line-height:1}
.qn small{font-size:16px;color:var(--mute);font-weight:400}
input[type=range]{width:100%;accent-color:#b58f45;margin:14px 0 10px}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:6px}
.chip{border:1px solid #c9b68a;background:#fffaf0;color:var(--ink);border-radius:99px;padding:5px 14px;font-size:13px}
.chip.on{background:var(--ink2);color:var(--cream);border-color:var(--ink2)}
.opt-line{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;margin:12px 0 4px;color:var(--ink)}
.btnrow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:18px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px;margin:22px 0 14px;font-size:14px;color:var(--gold)}
.qtop .prog{flex:1}
.qtop .prog .bar{margin:0;height:8px}
.qtop .cnt{font-variant-numeric:tabular-nums;color:var(--cream);white-space:nowrap}
.qtop .streak{white-space:nowrap}
.qtop .earn{display:flex;align-items:center;gap:4px;color:var(--cream);white-space:nowrap}
.qcard{padding:26px 20px 24px;text-align:center;position:relative}
.qcard .lab{font-size:12px;letter-spacing:2px;color:var(--gold3);text-transform:uppercase}
.qcard .lab b{color:var(--ink)}
.qcard .word{font-family:var(--jp);font-size:clamp(32px,7vw,54px);font-weight:700;color:var(--ink2);margin:10px 0 4px;line-height:1.2;word-break:break-all}
.qcard .kana{font-family:var(--jp);font-size:18px;color:#8a7650;min-height:26px}
.qcard .tools{position:absolute;right:12px;top:10px;display:flex;gap:6px}
.iconbtn{width:32px;height:32px;border-radius:50%;border:1px solid #cdbb90;background:#fffaf0;color:var(--ink);font-size:14px;display:grid;place-items:center}
.iconbtn:hover{background:#fff3d6}
.iconbtn.on{background:var(--ink2);color:var(--gold2);border-color:var(--ink2)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media(max-width:620px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:13px 14px;border-radius:8px;border:1px solid rgba(211,188,142,.45);background:linear-gradient(180deg,rgba(45,58,105,.85),rgba(26,33,66,.92));color:var(--cream2);font-size:15.5px;line-height:1.35;transition:all .15s;min-height:58px}
.opt:hover:not([disabled]){border-color:var(--gold2);box-shadow:0 0 0 1px var(--gold2),0 0 18px rgba(243,211,138,.25);transform:translateY(-1px)}
.opt .k{flex:none;width:28px;height:28px;display:grid;place-items:center;position:relative;font-size:13px;font-weight:700;color:var(--gold2)}
.opt .k:before{content:"";position:absolute;inset:3px;transform:rotate(45deg);border:1px solid var(--gold);background:rgba(0,0,0,.25)}
.opt .k span{position:relative}
.opt[disabled]{cursor:default}
.opt.ok{background:linear-gradient(180deg,#e8f5e1,#d5ebcb);color:#23461f;border-color:var(--ok);box-shadow:0 0 0 2px var(--ok),0 0 22px rgba(95,174,99,.45)}
.opt.ok .k{color:#2b6b2e}.opt.ok .k:before{border-color:var(--ok);background:#fff}
.opt.bad{background:linear-gradient(180deg,#f8e3df,#f0d0ca);color:#5a1f1b;border-color:var(--bad);animation:shake .35s}
.opt.bad .k{color:var(--bad)}.opt.bad .k:before{border-color:var(--bad);background:#fff}
.opt.dim{opacity:.45}
@keyframes shake{25%{transform:translateX(-5px)}50%{transform:translateX(5px)}75%{transform:translateX(-3px)}}

.reveal{margin-top:16px;padding:16px;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:18px;align-items:center;animation:rise .3s ease}
@keyframes rise{from{opacity:0;transform:translateY(10px)}}
@media(max-width:700px){.reveal{grid-template-columns:1fr}}
.frame{position:relative;border-radius:6px;padding:6px;background:linear-gradient(135deg,#f3d38a,#a88b55 40%,#f3d38a 60%,#8a6f3f);box-shadow:0 8px 24px rgba(0,0,0,.4)}
.frame .inner{position:relative;aspect-ratio:4/3;border-radius:3px;overflow:hidden;background:#1a2142;display:grid;place-items:center}
.frame img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .35s}
.frame img.on{opacity:1}
.frame .ph{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--jp);font-size:44px;color:rgba(243,211,138,.5);text-align:center;padding:10px}
.frame .ph.load{background:linear-gradient(100deg,#1a2142 30%,#2a3668 50%,#1a2142 70%);background-size:300% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{from{background-position:100% 0}to{background-position:0 0}}
.frame .cap{position:absolute;left:6px;right:6px;bottom:6px;font-size:10.5px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.7));padding:14px 8px 5px;border-radius:0 0 3px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frame .swap{position:absolute;right:12px;top:12px;z-index:2;border:1px solid rgba(243,211,138,.7);background:rgba(11,15,34,.75);color:var(--gold2);border-radius:99px;padding:4px 10px;font-size:12px}
.frame .swap:hover{background:rgba(11,15,34,.95)}
.frame img.contain{object-fit:contain;background:#0c1026}
.frame img.splash{object-position:center 30%}
.mtabs{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
.mtabs button{flex:1;min-width:0;border:1px solid rgba(211,188,142,.45);background:rgba(0,0,0,.25);color:var(--gold);border-radius:99px;padding:6px 8px;font-size:13px;white-space:nowrap}
.mtabs button.on{background:var(--cream);color:var(--ink2);border-color:var(--cream);font-weight:600}
.buddy{display:flex;align-items:flex-start;gap:10px;margin-top:12px}
.buddy .av{flex:none;width:58px;height:58px;border-radius:50%;overflow:hidden;border:2px solid var(--gold);background:linear-gradient(160deg,var(--elc,#5a6fa8),#1a2142)}
.buddy .av img{width:100%;height:100%;object-fit:cover;display:block}
.buddy .bubble{position:relative;flex:1;background:var(--cream);color:var(--ink2);border-radius:10px;padding:8px 12px;font-size:14px;line-height:1.4}
.buddy .bubble:before{content:"";position:absolute;left:-7px;top:16px;border:7px solid transparent;border-left:none;border-right-color:var(--cream)}
.buddy .bubble b{display:block;font-size:12px;color:var(--gold3)}
.rhero{position:relative;height:230px;margin:-30px -20px 18px;border-radius:6px 6px 0 0;overflow:hidden;background:#1a2142}
.rhero img{width:100%;height:100%;object-fit:cover;object-position:center 25%}
.rhero:after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(22,29,58,.95))}
.rhero .say{position:absolute;left:16px;right:16px;bottom:14px;z-index:1;text-align:left;font-size:15px;color:#fff;text-shadow:0 1px 4px #000}
.rhero .say b{color:var(--gold2)}
.rgif{max-width:260px;width:100%;border-radius:8px;border:2px solid var(--gold);margin:14px auto 0;display:block}
@media(max-width:560px){.rhero{height:170px}}
.info .verdict{font-size:20px;font-weight:700;margin-bottom:8px;display:flex;align-items:center;gap:8px}
.info .verdict.ok{color:#9be29e}.info .verdict.bad{color:#ff9a90}
.info .w{font-family:var(--jp);font-size:30px;font-weight:700;color:var(--cream2);line-height:1.25}
.info .r{font-family:var(--jp);color:var(--gold);font-size:17px;margin:2px 0 10px}
.info .m{font-size:17px;color:var(--cream2);line-height:1.45;padding:10px 12px;border-left:3px solid var(--gold);background:rgba(0,0,0,.2);border-radius:0 6px 6px 0}
.info .gain{margin-top:10px;font-size:14px;color:var(--gold2);display:flex;align-items:center;gap:6px}
.info .next{margin-top:16px}
.hint{font-size:12px;color:var(--mute);margin-top:10px}
.float{position:fixed;z-index:60;pointer-events:none;font-weight:700;color:var(--gold2);font-size:20px;display:flex;align-items:center;gap:4px;text-shadow:0 2px 8px rgba(0,0,0,.6);animation:floatup 1.1s ease-out forwards}
@keyframes floatup{to{transform:translateY(-70px);opacity:0}}

/* result */
.result{text-align:center;padding:30px 20px 26px;margin-top:30px}
.result h2{margin:0;font-size:28px;color:var(--gold2)}
.bigstars{font-size:46px;letter-spacing:6px;margin:12px 0 4px}
.bigstars span{display:inline-block;color:rgba(211,188,142,.2);transform:scale(.4);opacity:0;animation:pop .45s forwards}
.bigstars span.on{color:var(--gold2);text-shadow:0 0 20px rgba(243,211,138,.7)}
@keyframes pop{to{transform:scale(1);opacity:1}}
.score{font-size:52px;font-weight:700;color:var(--cream2);font-variant-numeric:tabular-nums}
.score small{font-size:20px;color:var(--gold)}
.rew{display:inline-flex;align-items:center;gap:8px;margin-top:10px;padding:8px 18px;border-radius:99px;background:rgba(0,0,0,.35);border:1px solid rgba(211,188,142,.4);font-size:17px}
.rew svg{width:24px;height:24px}
.newbest{display:inline-block;margin-left:8px;font-size:12px;background:var(--gold2);color:var(--ink2);padding:2px 8px;border-radius:99px;vertical-align:middle}
.wronglist{margin-top:22px;text-align:left}
.wronglist h3{font-size:15px;color:var(--gold);margin:0 0 10px;font-weight:600}
.wl{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px}
.wl div{background:rgba(0,0,0,.25);border:1px solid rgba(211,188,142,.2);border-radius:6px;padding:8px 10px}
.wl b{font-family:var(--jp);color:var(--cream2);font-size:16px}
.wl i{font-style:normal;font-family:var(--jp);color:var(--gold);font-size:13px;margin-left:6px}
.wl p{margin:3px 0 0;font-size:13px;color:#c9cbd6}

/* wish */
.banner{position:relative;overflow:hidden;border-radius:8px;border:1px solid rgba(243,211,138,.6);min-height:250px;padding:26px 24px;background:
  radial-gradient(500px 260px at 85% 40%,rgba(255,200,120,.35),transparent 70%),
  radial-gradient(400px 260px at 15% 90%,rgba(160,107,214,.35),transparent 70%),
  linear-gradient(120deg,#1d1b3e,#3a2f6b 45%,#6b3f5e);box-shadow:0 14px 40px rgba(0,0,0,.45)}
.banner .big{position:absolute;right:4%;top:50%;transform:translateY(-50%);font-size:150px;filter:drop-shadow(0 0 30px rgba(255,210,120,.6));animation:bob 5s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-56%)}}

const topicOf = n => DATA.find(t => t.n === n);
function wordsOf(n, key){
  const T = topicOf(n);
  if(key !== "all") return T.sections.find(s => s.key === key).words.map(w => ({w:w[0], r:w[1], m:w[2], t:n}));
  const seen = new Set(), out = [];
  T.sections.forEach(s => s.words.forEach(w => { if(!seen.has(w[0])){ seen.add(w[0]); out.push({w:w[0], r:w[1], m:w[2], t:n}); } }));
  return out;
}
function starsFor(pct){ return pct >= 95 ? 3 : pct >= 80 ? 2 : pct >= 60 ? 1 : 0; }

function go(v, arg){
  if(Q && Q.active && v !== "quiz" && !confirm("Thoát bài kiểm tra hiện tại? Tiến độ bài này sẽ không được lưu.")) return;
  if(Q) Q.active = false;
  closeModal();
  view = v;
  if(v === "home") renderHome();
  else if(v === "topic") renderTopic(arg ?? curTopic);
  else if(v === "wish") renderWish();
  window.scrollTo({top:0});
}

let Q = null;
function startQuiz(o){
  Q = {topic:o.topic, key:o.key, retry:o.retry, list:o.words, idx:0, correct:0, wrong:[], streak:0, earned:0, answered:false, active:true};

function makeOptions(item){
  const T = topicOf(item.t);
  const pool = shuffle(T.sections.flatMap(s => s.words.map(w => w[2])));
  const bad = new Set([item.m.trim().toLowerCase()]);
  const opts = [];
  for(const m of pool){ const k = m.trim().toLowerCase(); if(!bad.has(k)){ bad.add(k); opts.push(m); } if(opts.length === 3) break; }
  if(opts.length < 3){ for(const t of shuffle(DATA)) for(const s of t.sections) for(const w of s.words){ const k=w[2].trim().toLowerCase(); if(opts.length<3 && !bad.has(k)){ bad.add(k); opts.push(w[2]); } } }
  const all = shuffle([...opts, item.m]);
  return {all, ans: all.indexOf(item.m)};
}
function renderQ(){
  const item = Q.list[Q.idx];
  Q.cur = item; Q.opts = makeOptions(item); Q.answered = false;

/* ---------- images ---------- */
const IMG_CACHE = new Map();
function fetchJSON(url, ms=9000){
  const ctl = new AbortController(); const t = setTimeout(()=>ctl.abort(), ms);
  return fetch(url, {signal:ctl.signal}).then(r => { clearTimeout(t); if(!r.ok) throw new Error(r.status); return r.json(); });
}
async function srcWiki(kw){
  const j = await fetchJSON(`https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=640&titles=${encodeURIComponent(kw)}`);
  return Object.values(j.query?.pages || {}).filter(p => p.thumbnail && !/\.svg/i.test(p.thumbnail.source)).map(p => ({url:p.thumbnail.source, src:"Wikipedia"}));
}
async function srcOpenverse(kw){
  const j = await fetchJSON(`https://api.openverse.org/v1/images/?q=${encodeURIComponent(kw)}&page_size=8&mature=false`);
  return (j.results || []).map(x => ({url:x.thumbnail || x.url, src:"Openverse" + (x.creator ? " · " + x.creator : "")}));
}
async function srcCommons(kw){
  const j = await fetchJSON(`https://commons.wikimedia.org/w/api.php?action=query&format=json&origin=*&generator=search&gsrnamespace=6&gsrlimit=8&gsrsearch=${encodeURIComponent(kw + " filetype:bitmap")}&prop=imageinfo&iiprop=url|mime&iiurlwidth=640`);
  return Object.values(j.query?.pages || {}).sort((a,b)=>a.index-b.index)
    .filter(p => p.imageinfo && /jpeg|png|webp/.test(p.imageinfo[0].mime)).map(p => ({url:p.imageinfo[0].thumburl, src:"Wikimedia Commons"}));
}
function kwFor(w){ return KW[w] || w.replace(/[～~『』「」（）()]/g, " ").trim(); }
function candidates(w){
  if(IMG_CACHE.has(w)) return IMG_CACHE.get(w);
  const kw = kwFor(w);
  const p = Promise.allSettled([srcWiki(kw), srcOpenverse(kw), srcCommons(kw)]).then(rs => {
    const seen = new Set(), list = [];
    rs.forEach(r => { if(r.status === "fulfilled") r.value.forEach(x => { if(x.url && !seen.has(x.url)){ seen.add(x.url); list.push(x); } }); });
    return list;
  });
  IMG_CACHE.set(w, p);
  return p;
}

function nekoCat(item, ok){
  const t = kwFor(item.w);
  for(const [c, re] of NEKO_MAP) if(re.test(t)) return [c, true];
  return [pickRand(ok ? ["thumbsup","happy","smile","dance","clap","highfive","nod","salute"] : ["cry","facepalm","shocked","confused","pout","shrug"]), false];

const EL_OF_TOPIC = {Anemo:"Wind",Pyro:"Fire",Electro:"Electric",Hydro:"Water",Dendro:"Grass",Cryo:"Ice",Geo:"Rock"};
function genshinList(item){
  const kw = kwFor(item.w).toLowerCase(), out = [];
  const wt = /sword|katana|blade|knife/.test(kw) ? [0,1] : /\bbow|arrow|archer/.test(kw) ? [3] : /spear|polearm|naginata|lance/.test(kw) ? [2] : /\bbook|magic|spell/.test(kw) ? [4] : null;

  const el = EL_OF_TOPIC[TOPIC_EL[item.t][0]];
  shuffle(GI.A.filter(a => a[2] === el)).concat(shuffle(GI.A.filter(a => a[2] !== el))).slice(0,14)
    .forEach(a => out.push({url:giASplash(a[3]), fb:giAIcon(a[3]), src:`Genshin Impact · ${a[0]} (Hệ ${(ELEM[a[2]]||[""])[0]} · ${a[1]}★)`, splash:true}));

}
function mediaList(item, mode){
  if(mode === "photo") return candidates(item.w);
  const ok = Q ? Q.lastOk : true;
  const key = mode + "|" + item.w + (mode === "anime" ? "|" + ok : "");
  if(IMG_CACHE.has(key)) return IMG_CACHE.get(key);
  let p;
  if(mode === "anime"){
    const [cat, rel] = nekoCat(item, ok);
    p = fetchJSON(`https://nekos.best/api/v2/${cat}?amount=8`)
      .then(j => (j.results || []).map(x => ({url:x.url, src:(rel ? "Anime gợi ý nghĩa" : ok ? "Meme ăn mừng" : "Meme an ủi") + " · " + (x.anime_name || x.artist_name || "nekos.best"), contain:true})))
      .catch(() => []);
  } else p = Promise.resolve(genshinList(item));
  IMG_CACHE.set(key, p);
  return p;
}

}
async function showImg(item, step=0){
  const req = ++imgReq, mode = S.imgTab || "photo";
  const frame = $("#frame"); if(!frame) return;
  const img = frame.querySelector("img"), ph = frame.querySelector(".ph"), cap = $("#cap");
  img.className = ""; ph.style.display = ""; ph.className = "ph load"; ph.textContent = ""; cap.textContent = "";
  const list = await mediaList(item, mode);
  if(req !== imgReq || !$("#frame")) return;
  if(!list.length){ ph.className = "ph"; ph.textContent = item.w; cap.textContent = "Không tìm thấy ảnh (kiểm tra kết nối mạng)"; return; }
  const mk = mode + "|" + item.w;
  const start = ((mode === "photo" ? (S.pick[item.w] || 0) : (MEDIA_IDX[mk] || 0)) + step) % list.length;
  const tryLoad = (n, tries, useFb) => {
    if(tries >= list.length){ ph.className = "ph"; ph.textContent = item.w; cap.textContent = "Không tải được ảnh"; return; }
    const c = list[n];
    img.onload = () => {
      if(req !== imgReq) return;
      ph.style.display = "none";
      img.className = "on" + (c.contain || useFb ? " contain" : "") + (c.splash && !useFb ? " splash" : "");
      cap.textContent = `${c.src} · ${n+1}/${list.length}` + (mode === "photo" ? ` · từ khóa: ${kwFor(item.w)}` : "");
      if(mode === "photo"){ S.pick[item.w] = n; save(); } else MEDIA_IDX[mk] = n;
    };
    img.onerror = () => { if(req !== imgReq) return; if(c.fb && !useFb) tryLoad(n, tries, true); else tryLoad((n+1) % list.length, tries+1, false); };
    img.src = useFb ? c.fb : c.url;
  };
  tryLoad(start, 0, false);
}
function nextImg(){ if(Q && Q.cur) showImg(Q.cur, 1); }

/* ---------- wish (Genshin) ---------- */
const FIVE_CHARS = GI.A.filter(a => a[1] === 5);
const FOUR_CHARS = GI.A.filter(a => a[1] === 4);
const bannerPhase = () => Math.floor(Date.now() / 86400000 / 3); // đổi banner mỗi 3 ngày
function featured(){ return FIVE_CHARS[bannerPhase() % FIVE_CHARS.length]; }
function featured4(){ const p = bannerPhase(); return [0,1,2].map(i => FOUR_CHARS[(p * 3 + i * 7) % FOUR_CHARS.length]); }
function giItem(kind, x){
  return kind === "a"
    ? {id:"a:" + x[3], kind, name:x[0], r:x[1], el:x[2], icon:giAIcon(x[3]), art:giASplash(x[3])}
    : {id:"w:" + x[2], kind, name:x[0], r:x[1], wt:x[3], icon:giWIcon(x[2]), art:giWGacha(x[2])};
}
function findItem(id){
  const k = id.slice(0,1), c = id.slice(2);
  const x = k === "a" ? GI.A.find(a => a[3] === c) : GI.W.find(w => w[2] === c);
  return x ? giItem(k, x) : null;
}
function rollOne(){
  S.pity5++; S.pity4++;
  let p5 = 0.006; if(S.pity5 >= 74) p5 = 0.006 + (S.pity5 - 73) * 0.06;
  let it;
  if(S.pity5 >= 90 || Math.random() < p5){
    S.pity5 = 0; S.pity4 = 0;
    if(S.guar || Math.random() < .5){ it = giItem("a", featured()); S.guar = false; }
    else { S.guar = true; it = Math.random() < .6 ? giItem("a", pickRand(FIVE_CHARS.filter(a => a !== featured()))) : giItem("w", pickRand(GI.W.filter(w => w[1] === 5))); }
  } else if(S.pity4 >= 10 || Math.random() < 0.051){
    S.pity4 = 0;
    if(Math.random() < .5) it = giItem("a", Math.random() < .5 ? pickRand(featured4()) : pickRand(FOUR_CHARS));
    else it = giItem("w", pickRand(GI.W.filter(w => w[1] === 4)));
  } else it = giItem("w", pickRand(GI.W.filter(w => w[1] === 3)));
  S.ginv[it.id] = (S.ginv[it.id] || 0) + 1;
  S.wishes++;
  return it;
}
function dupTag(it){ const n = S.ginv[it.id] || 1; return it.kind === "a" ? "C" + Math.min(n - 1, 6) : "R" + Math.min(n, 5); }
function itemSub(it){ return it.kind === "a" ? "Nhân vật · Hệ " + (ELEM[it.el] || [""])[0] : "Vũ khí · " + WTYPE[it.wt]; }
function setInvFilter(f){ S.invFilter = f; save(); renderWish(); }
function renderWish(){
  const F = featured(), el = ELEM[F[2]] || ["", "#fff"];
  const owned = Object.keys(S.ginv).map(findItem).filter(Boolean);
  const f = S.invFilter || "all";
  const shown = owned.filter(it => f === "all" || it.kind === f).sort((a,b) => b.r - a.r || S.ginv[b.id] - S.ginv[a.id]);
  const nA = owned.filter(i => i.kind === "a").length, nW = owned.length - nA;
  let h = `<button class="back" onclick="go('home')">‹ Về Sổ Tay</button>
  <div class="pagehead" style="margin-top:10px"><h1>Cầu Nguyện</h1><p>Dùng Nguyên Thạch kiếm được khi trả lời đúng để triệu hồi nhân vật và vũ khí Genshin Impact</p><div class="orn"><span></span></div></div>
  <div class="banner gi" style="background-image:url('${giASplash(F[3])}')">
    <div class="tag">ƯỚC NGUYỆN NHÂN VẬT SỰ KIỆN</div>
    <h2>${esc(F[0])}</h2>
    <p><b style="color:${el[1]}">Hệ ${el[0]}</b> · Tăng tỉ lệ nhận ${esc(F[0])} 5★. Tỉ lệ 5★ cơ bản 0,6% · bảo hiểm 90 lần · 4★ trở lên chắc chắn mỗi 10 lần · thua 50/50 thì lần 5★ sau chắc chắn ra nhân vật sự kiện. Banner đổi mỗi 3 ngày.</p>
    <div class="feat"><img src="${giAIcon(F[3])}" title="${esc(F[0])}" alt="">${featured4().map(a => `<img src="${giAIcon(a[3])}" title="${esc(a[0])} (4★)" alt="">`).join("")}</div>
  </div>
  <div class="wishbar">
    <div class="pity">Đã cầu nguyện: <b>${S.wishes}</b> lần<br>Bảo hiểm 5★: <b>${S.pity5}</b>/90 · Bảo hiểm 4★: <b>${S.pity4}</b>/10${S.guar ? "<br><b>Lần 5★ tiếp theo chắc chắn ra nhân vật sự kiện</b>" : ""}</div>
    <div class="wishbtns">
      <button class="wishbtn" onclick="doWish(1)" ${S.primo<COST?"disabled":""}><b>Cầu Nguyện ×1</b><small>${PG} ${COST}</small></button>
      <button class="wishbtn" onclick="doWish(10)" ${S.primo<COST*10?"disabled":""}><b>Cầu Nguyện ×10</b><small>${PG} ${COST*10}</small></button>
    </div>
  </div>
  ${S.primo<COST?`<div class="panel" style="padding:12px 16px;margin-bottom:22px;font-size:14px;color:#c9cbd6">Chưa đủ Nguyên Thạch — mỗi câu đúng được <b style="color:var(--gold2)">+${PER_CORRECT}</b>, chuỗi 5 câu đúng thêm +10, hoàn thành bài ≥90% thêm +20/+50.</div>`:""}
  <div class="inv"><h3>Túi Đồ · Nhân vật ${nA}/${GI.A.length} · Vũ khí ${nW}/${GI.W.length}</h3>
  <div class="filt">${[["all","Tất cả"],["a","Nhân vật"],["w","Vũ khí"]].map(([k,l]) => `<button class="chip ${f===k?'on':''}" onclick="setInvFilter('${k}')">${l}</button>`).join("")}</div>`;
  if(!shown.length) h += `<div class="panel" style="padding:16px;color:#c9cbd6;font-size:14px">Túi đồ trống — hãy cầu nguyện để sưu tầm nhân vật và vũ khí!</div>`;
  else h += `<div class="invgrid">` + shown.map(it => {
    const e = it.kind === "a" ? ELEM[it.el] : null;
    return `<div class="item r${it.r}" title="${esc(it.name)}"><div class="art"><img src="${it.icon}" alt="" loading="lazy"></div><div class="st">${"★".repeat(it.r)}</div><span class="ct">${dupTag(it)}</span>${e ? `<span class="el" style="background:${e[1]}">${e[0]}</span>` : ""}<div class="nm">${esc(it.name)}</div><div class="jn">${it.kind === "a" ? "Nhân vật" : WTYPE[it.wt]}</div></div>`;
  }).join("") + `</div>`;
  h += `</div>`;
  $("#app").innerHTML = h;
}
function doWish(n){
  if(S.primo < COST*n){ toast("Không đủ Nguyên Thạch"); return; }
  S.primo -= COST*n;
  const res = []; for(let i=0;i<n;i++) res.push(rollOne());
  save();
  const col = r => r === 5 ? "#f1bd55" : r === 4 ? "#b27cff" : "#6fb0ff";
  const fx = document.createElement("div");
  fx.className = "wishfx"; fx.style.setProperty("--mc", col(Math.max(...res.map(x => x.r))));
  fx.innerHTML = `<button class="skip">Bỏ qua ›</button><div class="meteor"></div><div class="flash"></div>`;
  document.body.appendChild(fx);
  res.forEach(x => { const i = new Image(); i.src = x.art; }); // tải trước ảnh trong lúc sao băng rơi
  let shown = false;
  const show = () => {
    if(shown) return; shown = true;
    if(n === 1){
      const x = res[0];
      fx.style.setProperty("--mc", col(x.r));
      fx.innerHTML = `<div class="single"><img class="art" src="${x.art}" onerror="this.onerror=null;this.src='${x.icon}'" alt=""><h2>${esc(x.name)}</h2><div class="j">${itemSub(x)} · ${dupTag(x)}</div><div class="s">${"★".repeat(x.r)}</div></div>`;
    } else {
      const order = res.slice().sort((a,b) => b.r - a.r || (a.kind === "a" ? -1 : 1));
      fx.innerHTML = `<div class="pulls">${order.map((x,i) => `<div class="pull r${x.r} ${x.kind}" style="animation-delay:${i*.09}s" title="${esc(x.name)}"><img class="pic" src="${x.art}" onerror="this.onerror=null;this.src='${x.icon}';this.style.objectFit='contain'" alt=""><div class="shade"></div><div class="n">${esc(x.name)}</div><div class="s">${"★".repeat(x.r)}</div></div>`).join("")}</div>`;
    }
    const f = document.createElement("div"); f.className = "fxfoot btnrow";
    f.innerHTML = `<button class="gbtn x"><span class="c"></span>Đóng</button>`;
    f.querySelector("button").onclick = () => { fx.remove(); renderWish(); };
    fx.appendChild(f);
  };
  fx.querySelector(".skip").onclick = show;
  setTimeout(show, 2100);
}

updPrimo();
renderHome();
</script>
